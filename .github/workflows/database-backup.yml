name: Automated Database Backup

on:
  schedule:
    # Run every night at 02:00 UTC (07:30 AM IST)
    - cron: '0 2 * * *'
  workflow_dispatch: # Allows manual trigger anytime from GitHub UI
    inputs:
      force_weekly:
        description: 'Force copy to weekly tier (even if not Sunday)'
        required: false
        type: boolean
        default: false
      force_monthly:
        description: 'Force copy to monthly tier (even if not 1st of month)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  issues: write # Allows automatic creation of alert issues upon backup failure

jobs:
  backup:
    name: Backup PostgreSQL to Cloudflare R2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install PostgreSQL Client & Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client gnupg awscli

      - name: Run Backup, Encrypt & Upload to Cloudflare R2
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          FORCE_WEEKLY: ${{ inputs.force_weekly }}
          FORCE_MONTHLY: ${{ inputs.force_monthly }}
        run: |
          chmod +x scripts/backup-database.sh
          ./scripts/backup-database.sh

      - name: Create GitHub Alert Issue on Failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const issueTitle = `🚨 Database Backup Failed [Run #${context.runNumber}]`;
            const issueBody = [
              `### ⚠️ Automated Database Backup Alert`,
              ``,
              `- **Run URL**: [View Failure Logs](${runUrl})`,
              `- **Triggered By**: \`${context.actor}\` (${context.eventName})`,
              `- **Timestamp**: \`${new Date().toISOString()}\``,
              `- **Repository**: \`${context.repo.owner}/${context.repo.repo}\``,
              ``,
              `**Action Required**: The nightly PostgreSQL backup to Cloudflare R2 failed to complete. Inspect the action logs above to check database availability, encryption key, or R2 credentials.`
            ].join('\n');
            
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: issueTitle,
              body: issueBody,
              labels: ['bug', 'security']
            });
